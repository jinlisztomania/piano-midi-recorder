<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>피아노 MIDI 녹음기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #E8EDE9;
    --ink: #1C2421;
    --ink2: #44514B;
    --muted: #5B6660;
    --line: #C9D2CC;
    --rec: #C8102E;     /* red: recording, not yet received */
    --ok: #2E6B4F;      /* green: received */
    --flag: #D9730D;    /* orange: suspect notes (checking only) */
    --panel: #F7F9F7;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    font-size: 19px; line-height: 1.55;
  }
  button { font: inherit; }

  /* ---------- layout: left (record + play), right (list) ---------- */
  .app {
    max-width: 1560px; margin: 0 auto; padding: 18px 28px 28px;
    display: grid; gap: 16px 28px;
    grid-template-columns: minmax(0, 1fr) 410px;
    grid-template-rows: auto auto 1fr;
    grid-template-areas: "top list" "rec list" "player list";
  }
  .app > * { min-width: 0; }
  .topbar { grid-area: top; }
  .recorder { grid-area: rec; }
  .player { grid-area: player; align-self: start; }
  .list {
    grid-area: list; align-self: start;
    position: sticky; top: 22px; max-height: calc(100vh - 44px);
    display: flex; flex-direction: column;
    background: var(--panel); border-radius: 16px; padding: 18px 18px 20px;
  }
  .listscroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; margin: 0 -6px; padding: 2px 6px 4px; }
  @media (max-width: 1100px) {
    .app {
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: none;
      grid-template-areas: "top" "rec" "list" "player";
      padding: 20px 16px 40px;
    }
    .list { position: static; max-height: none; }
    .listscroll { overflow: visible; }
  }

  /* ---------- environment checks ---------- */
  .checks { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .chk {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 16px; padding: 5px 12px 5px 8px; border-radius: 999px;
    background: var(--panel); border: 2px solid var(--line); color: var(--ink);
  }
  .chk .ic {
    width: 20px; height: 20px; border-radius: 50%; flex: none;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; color: #fff; background: var(--muted);
  }
  .chk.ok { border-color: var(--ok); }
  .chk.ok .ic { background: var(--ok); }
  .chk.bad { border-color: var(--rec); }
  .chk.bad .ic { background: var(--rec); }
  .chk.warn { border-color: var(--flag); }
  .chk.warn .ic { background: var(--flag); }
  .chk.wait .ic { background: var(--line); color: var(--ink); }
  .chk b { font-weight: 600; color: var(--muted); margin-right: 2px; }

  .fix {
    margin-top: 12px; padding: 16px 20px; border-radius: 14px;
    background: #fff; border: 3px solid var(--rec);
  }
  .fix.warn { border-color: var(--flag); }
  .fix[hidden] { display: none; }
  .fix h3 { margin: 0 0 4px; font-size: 21px; }
  .fix p { margin: 0; font-size: 18px; }
  .fix .addr { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .fix .addr code {
    flex: 1 1 280px; min-width: 0; overflow-wrap: anywhere;
    font-size: 16px; padding: 8px 12px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line);
  }
  .fix .addr button {
    font-size: 17px; font-weight: 700; padding: 8px 18px; border-radius: 8px; cursor: pointer;
    border: none; background: var(--ink); color: #fff;
  }
  .app.blocked .recorder, .app.blocked .player, .app.blocked .list { display: none; }
  .app.blocked { grid-template-areas: "top top" ; }
  @media (max-width: 1100px) { .app.blocked { grid-template-areas: "top"; } }

  /* ---------- top status ---------- */
  .status { display: flex; align-items: center; gap: 10px; font-size: 21px; font-weight: 600; }
  .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--muted); flex: none; }
  .status.ok .dot { background: var(--ok); }
  .status.bad .dot { background: var(--rec); }
  .hint { color: var(--muted); font-size: 17px; margin: 2px 0 0 24px; min-height: 0; }
  .hint:empty { display: none; }

  /* ---------- recorder row ---------- */
  .recorder {
    display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
    align-items: center; gap: 28px;
    background: var(--panel); border-radius: 16px; padding: 16px 26px;
  }
  .song label { display: block; font-size: 17px; font-weight: 600; margin-bottom: 6px; }
  #songName {
    width: 100%; font-size: 22px; font-weight: 600; font-family: inherit;
    padding: 10px 14px; border: 3px solid var(--ink); border-radius: 12px;
    background: #fff; color: var(--ink);
  }
  #songName:focus { outline: none; border-color: var(--ink2); box-shadow: 0 0 0 3px var(--line); }
  #songName:disabled { opacity: .55; }
  #nextName { color: var(--muted); font-size: 16px; margin: 8px 0 0; }
  #nextName b { color: var(--ink); font-weight: 600; }

  #recBtn {
    flex: none; width: 172px; height: 172px; aspect-ratio: 1; border-radius: 50%;
    border: 9px solid var(--ink); background: #fff; color: var(--ink);
    font-size: 26px; font-weight: 700; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    transition: transform .08s ease;
  }
  #recBtn .icon { width: 54px; height: 54px; border-radius: 50%; background: var(--rec); }
  #recBtn.recording { background: var(--rec); border-color: var(--rec); color: #fff; }
  #recBtn.recording .icon { border-radius: 8px; background: #fff; width: 44px; height: 44px; }
  #recBtn:active { transform: scale(.97); }
  #recBtn:disabled { opacity: .4; cursor: not-allowed; }
  #recBtn:focus-visible { outline: 4px solid var(--ink2); outline-offset: 6px; }

  #timer { font-size: 46px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
  #timer.idle { color: var(--line); }
  #timer.on { color: var(--rec); }
  .meters {
    margin-top: 14px;
    display: grid; grid-template-columns: auto 1fr 2.4em; gap: 8px 12px; align-items: center;
    font-size: 16px; color: var(--muted);
  }
  .bar { height: 12px; background: #fff; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--ink2); }
  .num { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink); }

  @media (max-width: 760px) {
    .recorder { grid-template-columns: minmax(0, 1fr); justify-items: center; text-align: center; }
    .song, .live { width: 100%; }
  }

  /* ---------- player ---------- */
  .player { background: var(--panel); border-radius: 16px; padding: 18px 22px 16px; }
  .pempty {
    border: 2px dashed var(--line); border-radius: 12px; padding: 26px 18px;
    text-align: center; color: var(--muted); font-size: 18px;
  }
  .player.empty #pBody { display: none; }
  .player:not(.empty) .pempty { display: none; }
  .ptop { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  #playBtn {
    flex: none; width: 62px; height: 62px; border-radius: 50%;
    border: none; background: var(--ink); color: #fff; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  #playBtn svg { width: 24px; height: 24px; fill: currentColor; }
  #playBtn:disabled { opacity: .4; cursor: not-allowed; }
  #playBtn:focus-visible { outline: 3px solid var(--ink2); outline-offset: 3px; }
  .ptitle { flex: 1 1 200px; min-width: 0; }
  #pTitle { font-size: 21px; font-weight: 700; overflow-wrap: anywhere; line-height: 1.3; }
  .ptime { font-variant-numeric: tabular-nums; font-size: 18px; color: var(--muted); }
  .ptime #pCur { color: var(--ink); font-weight: 600; }
  .psrc { display: flex; align-items: center; gap: 6px; font-size: 16px; color: var(--muted); }
  .psrc button {
    font-size: 16px; padding: 6px 14px; border-radius: 999px; cursor: pointer;
    border: 2px solid var(--line); background: #fff; color: var(--ink);
  }
  .psrc button[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: #fff; }
  .psrc button:disabled { opacity: .4; cursor: not-allowed; }
  #pNote { margin: 6px 0 0; font-size: 15px; color: var(--muted); text-align: right; }
  #pNote:empty { display: none; }
  #seek { width: 100%; margin: 8px 0 0; accent-color: var(--ink); height: 26px; cursor: pointer; }

  #rollWrap { margin-top: 8px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: #fff; }
  #roll { display: block; width: 100%; height: 310px; cursor: crosshair; touch-action: none; }
  .rolltop { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 10px; }
  #rollInfo { margin: 8px 0 0; font-size: 16px; min-height: 1.6em; font-variant-numeric: tabular-nums; }
  #rollInfo b { color: var(--flag); }
  .legend { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
  .legend i { display: inline-block; width: 80px; height: 10px; border-radius: 3px;
    background: linear-gradient(90deg, #C7D3E3, #6A86AD, #1F3554); }
  #advToggle {
    font-size: 15px; padding: 5px 12px; border-radius: 8px; cursor: pointer;
    border: 2px solid var(--line); background: #fff; color: var(--ink);
  }
  #advToggle[aria-expanded="true"] { border-color: var(--ink); }
  .rollbar {
    display: none; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 8px; padding: 8px 10px;
    background: #fff; border: 1px solid var(--line); border-radius: 10px; font-size: 15px; color: var(--muted);
  }
  .player.adv .rollbar { display: flex; }
  .rollbar button {
    font-size: 15px; padding: 5px 12px; border-radius: 8px; cursor: pointer;
    border: 2px solid var(--line); background: #fff; color: var(--ink);
  }
  .rollbar button:disabled { opacity: .45; cursor: not-allowed; }
  .rollbar .sp { flex: 1; }
  .rollbar label { display: flex; align-items: center; gap: 6px; cursor: pointer; color: var(--ink); }
  .rollbar input { width: 18px; height: 18px; accent-color: var(--flag); }
  .rollbar .flagkey { display: inline-block; width: 14px; height: 12px; border: 2px solid var(--flag); border-radius: 3px; vertical-align: -1px; }

  /* ---------- list ---------- */
  .list h2 { font-size: 20px; margin: 0 0 12px; display: flex; justify-content: space-between; align-items: baseline; }
  .list h2 small { font-size: 15px; font-weight: 400; color: var(--muted); }
  #bulk { display: none; margin: 0 0 14px; }
  #bulk button {
    width: 100%; font-size: 19px; font-weight: 700; padding: 13px 16px;
    background: var(--ok); color: #fff; border: none; border-radius: 12px; cursor: pointer;
  }
  #bulk button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  #bulk small { display: block; color: var(--muted); font-size: 14px; margin-top: 5px; text-align: center; }
  #files { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  #files li {
    padding: 12px 14px; border: 3px solid var(--line); border-radius: 12px; background: #fff;
  }
  #files li.got { border-color: var(--ok); }
  #files li.pending { border-color: var(--rec); }
  #files li.playing { box-shadow: inset 6px 0 0 var(--ink); padding-left: 20px; }
  #files li.fresh { animation: fresh 1.4s ease-out; }
  @keyframes fresh { from { background: #FCE8EB; } to { background: #fff; } }
  #files .meta { display: flex; justify-content: space-between; font-size: 15px; color: var(--muted); margin-bottom: 6px; }
  #files .done, #files .todo { font-weight: 700; }
  #files .done { color: var(--ok); }
  #files .todo { color: var(--rec); }
  #files label.name { display: flex; align-items: center; gap: 4px; }
  #files input {
    flex: 1; min-width: 0; font-family: inherit; font-size: 18px; font-weight: 600; padding: 7px 10px;
    border: 2px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink);
  }
  #files input:focus { outline: none; border-color: var(--ink2); }
  #files .ext { color: var(--muted); font-size: 16px; }
  #files .row { display: grid; grid-template-columns: 1fr 1.35fr 1fr; gap: 6px; margin-top: 8px; }
  #files .row button {
    font-size: 16px; font-weight: 600; padding: 7px 6px; border-radius: 8px; cursor: pointer;
    border: 2px solid var(--ink); background: #fff; color: var(--ink); white-space: nowrap;
  }
  #files .row button.listen.on { background: var(--ink); color: #fff; }
  #files .row button.del { border-color: var(--line); color: var(--muted); }
  #files .row button:focus-visible { outline: 3px solid var(--ink2); outline-offset: 2px; }
  #empty { color: var(--muted); font-size: 17px; padding: 18px 4px; text-align: center; border: 2px dashed var(--line); border-radius: 12px; }

  /* ---------- trash (tucked away) ---------- */
  .trash { flex: none; margin-top: 10px; border-top: 1px solid var(--line); padding-top: 6px; }
  .trash[hidden] { display: none; }
  #trashToggle {
    background: none; border: none; padding: 4px 2px; cursor: pointer;
    color: var(--muted); font-size: 14px;
  }
  #trashToggle:hover { color: var(--ink); }
  #trashList { list-style: none; margin: 4px 0 0; padding: 0; max-height: 180px; overflow-y: auto; display: none; }
  .trash.open #trashList, .trash.open .tnote { display: block; }
  #trashList li {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    padding: 6px 2px; font-size: 15px; color: var(--muted); border-bottom: 1px dashed var(--line);
  }
  #trashList li span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #trashList button {
    flex: none; font-size: 14px; padding: 3px 10px; cursor: pointer;
    border: 1.5px solid var(--ink2); border-radius: 6px; background: #fff; color: var(--ink);
  }
  .tnote { display: none; font-size: 13px; color: var(--muted); margin: 6px 0 0; }

  /* ---------- toast ---------- */
  #toast {
    position: fixed; left: 50%; top: 14px; transform: translate(-50%, -20px);
    background: var(--ink); color: #fff; font-size: 18px; padding: 12px 22px; border-radius: 12px;
    opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; max-width: calc(100vw - 32px);
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="checks" id="checks" aria-live="polite">
      <span class="chk wait" data-k="device"><span class="ic">·</span><b>기기</b><span class="tx">확인 중</span></span>
      <span class="chk wait" data-k="browser"><span class="ic">·</span><b>브라우저</b><span class="tx">확인 중</span></span>
      <span class="chk wait" data-k="midi"><span class="ic">·</span><b>MIDI 허용</b><span class="tx">확인 중</span></span>
      <span class="chk wait" data-k="piano"><span class="ic">·</span><b>피아노</b><span class="tx">확인 중</span></span>
    </div>
    <div class="fix" id="fix" hidden role="alert">
      <h3 id="fixTitle"></h3>
      <p id="fixText"></p>
      <div class="addr" id="fixAddr" hidden>
        <code id="addrText"></code>
        <button id="copyAddr">주소 복사</button>
      </div>
    </div>
  </header>

  <section class="recorder">
    <div class="song">
      <label for="songName">연주할 곡 이름</label>
      <input id="songName" type="text" placeholder="예: 쇼팽 녹턴 20번" autocomplete="off">
      <p id="nextName"></p>
    </div>
    <button id="recBtn" disabled aria-live="polite">
      <span class="icon"></span>
      <span id="recLabel">녹음 시작</span>
    </button>
    <div class="live">
      <div id="timer" class="idle">00:00</div>
      <div class="meters" aria-hidden="true">
        <span>건반 세기</span><div class="bar"><i id="velBar"></i></div><span id="velNum" class="num">0</span>
        <span>페달</span><div class="bar"><i id="pedalBar"></i></div><span id="pedalNum" class="num">0</span>
      </div>
    </div>
  </section>

  <section id="player" class="player empty" aria-label="재생">
    <div class="pempty">녹음 목록에서 <b>▶ 듣기</b>를 누르면 여기서 들을 수 있습니다.</div>
    <div id="pBody">
      <div class="ptop">
        <button id="playBtn" aria-label="재생"></button>
        <div class="ptitle">
          <div id="pTitle"></div>
          <div class="ptime"><span id="pCur">00:00</span> / <span id="pTot">00:00</span></div>
        </div>
        <div>
          <div class="psrc">
            <span>소리</span>
            <button class="src" data-src="piano" aria-pressed="false">피아노</button>
            <button class="src" data-src="computer" aria-pressed="false">컴퓨터</button>
          </div>
          <p id="pNote"></p>
        </div>
      </div>
      <input type="range" id="seek" min="0" max="1000" step="100" value="0" aria-label="재생 위치">
      <div class="rolltop">
        <div class="legend"><span>여림</span><i></i><span>셈</span></div>
        <button id="advToggle" aria-expanded="false">자세히 검수하기 ▾</button>
      </div>
      <div class="rollbar">
        <button id="zoomOut">넓게</button>
        <span id="zoomLabel">10초 화면</span>
        <button id="zoomIn">자세히</button>
        <span class="sp"></span>
        <label><input type="checkbox" id="flagToggle" checked> <span class="flagkey"></span> 의심 음 표시 (참고용)</label>
        <button id="prevFlag">이전</button>
        <button id="nextFlag">다음 의심 음</button>
      </div>
      <div id="rollWrap"><canvas id="roll"></canvas></div>
      <p id="rollInfo"></p>
    </div>
  </section>

  <aside class="list">
    <h2>녹음 목록 <small id="countLabel"></small></h2>
    <div id="bulk">
      <button id="bulkBtn">↓ 남은 녹음 모두 받기</button>
      <small>zip 파일 하나로 받아집니다</small>
    </div>
    <div class="listscroll" id="listScroll">
      <ul id="files"></ul>
      <div id="empty">녹음하면 여기에 쌓입니다</div>
    </div>
    <div class="trash" id="trash" hidden>
      <button id="trashToggle" aria-expanded="false">휴지통</button>
      <ul id="trashList"></ul>
      <p class="tnote">창을 닫으면 휴지통도 비워집니다</p>
    </div>
  </aside>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  const PPQ = 960;              // ticks per quarter note
  const TEMPO_US = 500000;      // 120 BPM -> 1 tick ≈ 0.52 ms
  const TICKS_PER_MS = PPQ * 1000 / TEMPO_US;

  const $ = (id) => document.getElementById(id);
  // ---- environment checks ----
  const checks = {};   // key -> {state, text, title, fix, addr, fatal}
  const ORDER = ["device", "browser", "midi", "piano"];
  const ICON = { ok: "✓", bad: "✕", warn: "!", wait: "·" };
  function setCheck(k, state, text, extra) {
    checks[k] = Object.assign({ state, text }, extra || {});
    renderChecks();
  }
  function renderChecks() {
    ORDER.forEach(k => {
      const c = checks[k], el = document.querySelector('.chk[data-k="' + k + '"]');
      if (!c || !el) return;
      el.className = "chk " + c.state;
      el.querySelector(".ic").textContent = ICON[c.state];
      el.querySelector(".tx").textContent = c.text;
    });
    // first problem (bad before warn) decides the fix card
    const prob = ORDER.map(k => checks[k]).find(c => c && c.state === "bad")
              || ORDER.map(k => checks[k]).find(c => c && c.state === "warn" && c.title);
    const fix = $("fix");
    if (prob && prob.title) {
      fix.hidden = false;
      fix.classList.toggle("warn", prob.state === "warn");
      $("fixTitle").textContent = prob.title;
      $("fixText").textContent = prob.fix || "";
      $("fixAddr").hidden = !prob.addr;
      $("addrText").textContent = location.href.split("#")[0];
    } else {
      fix.hidden = true;
    }
    document.querySelector(".app").classList.toggle("blocked",
      ORDER.some(k => checks[k] && checks[k].fatal));
  }
  $("copyAddr").addEventListener("click", () => {
    const url = location.href.split("#")[0];
    const done = () => { $("copyAddr").textContent = "복사됨 ✓"; setTimeout(() => $("copyAddr").textContent = "주소 복사", 2000); };
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(url).then(done, () => prompt("이 주소를 복사하세요", url));
    else prompt("이 주소를 복사하세요", url);
  });

  function detectEnv() {
    const ua = navigator.userAgent;
    const iOS = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
    const android = /Android/.test(ua);
    const mac = !iOS && /Macintosh|Mac OS X/.test(ua);
    const win = /Windows/.test(ua);
    let browser = "알 수 없는 브라우저", chromish = false;
    if (/Edg\//.test(ua)) { browser = "엣지"; chromish = true; }

    else if (/OPR\//.test(ua)) { browser = "오페라"; chromish = true; }
    else if (/SamsungBrowser/.test(ua)) { browser = "삼성 인터넷"; chromish = true; }
    else if (navigator.brave) { browser = "브레이브"; chromish = true; }
    else if (/CriOS|FxiOS|EdgiOS/.test(ua)) { browser = /CriOS/.test(ua) ? "크롬" : /FxiOS/.test(ua) ? "파이어폭스" : "엣지"; }
    else if (/Chrome\//.test(ua)) { browser = "크롬"; chromish = true; }
    else if (/Firefox\//.test(ua)) { browser = "파이어폭스"; }
    else if (/Safari\//.test(ua)) { browser = "사파리"; }

  function msgLength(status) {
    const hi = status & 0xF0;
    if (hi === 0xC0 || hi === 0xD0) return 2;
    if (hi >= 0x80 && hi <= 0xE0) return 3;
    return 0; // system messages are ignored
  }

  function onMessage(e) {
    const d = e.data;
    let i = 0;
    while (i < d.length) {
      const status = d[i];
      const len = msgLength(status);
      if (!len) { i++; continue; }
      const bytes = Array.from(d.slice(i, i + len));
      i += len;
      if (bytes.length < len) break;

      const hi = status & 0xF0, ch = status & 0x0F;
      if (hi === 0xB0) {
        ccState[ch + ":" + bytes[1]] = bytes[2];
        if (bytes[1] === 64) {
          $("pedalBar").style.width = (bytes[2] / 127 * 100) + "%";
          $("pedalNum").textContent = bytes[2];
        }
      } else if (hi === 0x90 && bytes[2] > 0) {
        $("velBar").style.width = (bytes[2] / 127 * 100) + "%";
        $("velNum").textContent = bytes[2];
      }

      if (recording) {
        const ts = (typeof e.timeStamp === "number" && e.timeStamp > 0) ? e.timeStamp : performance.now();
        events.push({ t: Math.max(0, ts - startTime), bytes });
      }
    }

  function fmtTime(ms) {

  function updateNext() {

    Object.keys(ccState).forEach(k => {

  function stop() {

  function cleanName(s) {

  function renderList() {

  // ---- Player ----
  const TONE_URL = "https://cdn.jsdelivr.net/npm/tone@14.8.49/build/Tone.js";
  const SAMPLE_BASE = "https://tonejs.github.io/audio/salamander/";
  const LOOKAHEAD = 80; // ms
  const ICON_PLAY = '<svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg>';
  const ICON_PAUSE = '<svg viewBox="0 0 24 24"><path d="M6 4h4.5v16H6zM13.5 4H18v16h-4.5z"/></svg>';
  const player = {
    take: null, playing: false, offset: 0, startPerf: 0, idx: 0, timer: null,
    src: null, dragging: false, active: new Set(), sustained: new Set(), pedal: 0, loading: false
  };
  let sampler = null, samplerLoading = null;
  const playBtn = $("playBtn"), seek = $("seek");

  function midiOut() {
    if (!midi) return null;
    const outs = Array.from(midi.outputs.values()).filter(o => o.state === "connected");
    if (!outs.length) return null;
    const names = inputs().map(i => i.name);
    return outs.find(o => names.includes(o.name)) || outs[0];
  }

  function loadScript(src) {
    return new Promise((res, rej) => {
      const s = document.createElement("script");
      s.src = src; s.onload = res; s.onerror = () => rej(new Error("script"));
      document.head.appendChild(s);
    });
  }
  function ensureSampler() {
    if (sampler) return Promise.resolve(sampler);
    if (!samplerLoading) {
      samplerLoading = (async () => {
        if (!window.Tone) await loadScript(TONE_URL);
        await Tone.start();
        const urls = {};
        for (let o = 0; o <= 8; o++) {
          for (const [k, f] of [["C", "C"], ["D#", "Ds"], ["F#", "Fs"], ["A", "A"]]) {
            if ((o === 0 && k !== "A") || (o === 8 && k !== "C")) continue;
            urls[k + o] = f + o + ".mp3";
          }
        }
        return await new Promise((res, rej) => {
          const t = setTimeout(() => rej(new Error("timeout")), 30000);
          const s = new Tone.Sampler({
            urls, baseUrl: SAMPLE_BASE, release: 1.2,
            onload: () => { clearTimeout(t); res(s); },
            onerror: (e) => { clearTimeout(t); rej(e); }
          }).toDestination();
        });
      })().then(s => { sampler = s; return s; })
        .catch(e => { samplerLoading = null; throw e; });
    }
    return samplerLoading;
  }

  function position() {
    if (!player.take) return 0;
    return player.playing ? Math.min(player.take.duration, performance.now() - player.startPerf) : player.offset;
  }

  function showMeters(bytes) {
    const hi = bytes[0] & 0xF0;
    if (hi === 0x90 && bytes[2] > 0) {
      $("velBar").style.width = (bytes[2] / 127 * 100) + "%"; $("velNum").textContent = bytes[2];
    } else if (hi === 0xB0 && bytes[1] === 64) {
      $("pedalBar").style.width = (bytes[2] / 127 * 100) + "%"; $("pedalNum").textContent = bytes[2];
    }
  }

  function dispatch(bytes, atPerf) {
    const hi = bytes[0] & 0xF0;
    const isOn = hi === 0x90 && bytes[2] > 0;
    const isOff = hi === 0x80 || (hi === 0x90 && bytes[2] === 0);
    const delay = Math.max(0, atPerf - performance.now());
    setTimeout(() => showMeters(bytes), delay);

    if (player.src === "piano") {
      const out = midiOut();
      if (!out) return;
      try { out.send(bytes, Math.max(atPerf, performance.now())); } catch (e) {}
      const key = (bytes[0] & 0x0F) + ":" + bytes[1];
      if (isOn) player.active.add(key); else if (isOff) player.active.delete(key);
    } else if (sampler) {
      const t = Tone.now() + delay / 1000;
      if (isOn) {
        const note = Tone.Frequency(bytes[1], "midi").toNote();
        player.sustained.delete(note);
        sampler.triggerAttack(note, t, Math.pow(bytes[2] / 127, 1.4));
      } else if (isOff) {
        const note = Tone.Frequency(bytes[1], "midi").toNote();
        if (player.pedal >= 64) player.sustained.add(note);
        else sampler.triggerRelease(note, t);
      } else if (hi === 0xB0 && bytes[1] === 64) {
        player.pedal = bytes[2];
        if (bytes[2] < 64 && player.sustained.size) {
          sampler.triggerRelease(Array.from(player.sustained), t);
          player.sustained.clear();
        }
      }
    }
  }

  function silence(src) {
    const once = () => {
      if (src === "piano") {
        const out = midiOut();
        if (!out) return;
        player.active.forEach(k => {
          const [ch, n] = k.split(":").map(Number);
          try { out.send([0x80 | ch, n, 0]); } catch (e) {}
        });
        for (let ch = 0; ch < 16; ch++) {
          try { out.send([0xB0 | ch, 64, 0]); out.send([0xB0 | ch, 123, 0]); } catch (e) {}
        }
      } else if (sampler) {
        sampler.releaseAll();
      }
    };
    once();
    setTimeout(once, LOOKAHEAD + 70); // catch anything already queued
    player.active.clear(); player.sustained.clear(); player.pedal = 0;
    $("pedalBar").style.width = "0%"; $("pedalNum").textContent = 0;
  }

  function tick() {
    const take = player.take;
    const pos = performance.now() - player.startPerf;
    const evs = take.events;
    while (player.idx < evs.length && evs[player.idx].t < pos + LOOKAHEAD) {
      const ev = evs[player.idx++];
      dispatch(ev.bytes, player.startPerf + ev.t);
    }
    if (pos >= take.duration) {
      pause();
      player.offset = 0;
      updatePlayerUI();
      return;
    }
    updateTime();
  }

  async function play() {
    const take = player.take;
    if (!take || player.playing || recording) return;
    if (player.src === "piano" && !midiOut()) player.src = "computer";
    if (player.src === "computer" && !sampler) {
      player.loading = true; updatePlayerUI();
      try { await ensureSampler(); }
      catch (e) {
        player.loading = false; updatePlayerUI();
        $("pNote").textContent = "소리를 못 불러왔어요 (인터넷 확인)";
        return;
      }
      player.loading = false;
      if (player.take !== take || recording) { updatePlayerUI(); return; }
    }
    if (player.offset >= take.duration - 50) player.offset = 0;

    // restore controller state (pedal etc.) at the start position
    const state = {};
    let i = 0;
    while (i < take.events.length && take.events[i].t < player.offset) {
      const b = take.events[i].bytes;
      if ((b[0] & 0xF0) === 0xB0) state[b[0] + ":" + b[1]] = b;
      i++;
    }
    player.idx = i;
    player.startPerf = performance.now() - player.offset;
    Object.values(state).forEach(b => dispatch(b, performance.now()));

    player.playing = true;
    player.timer = setInterval(tick, 20);
    tick();
    updatePlayerUI();
    refreshListState();
  }

  function pause() {
    if (!player.playing) return;
    player.offset = position();
    player.playing = false;
    clearInterval(player.timer);
    silence(player.src);
    updatePlayerUI();
    refreshListState();
  }

  function seekTo(ms) {
    const was = player.playing;
    if (was) pause();
    player.offset = Math.max(0, Math.min(ms, player.take.duration));
    updateTime();
    if (was) play();
  }

  function loadTake(f, autoplay) {
    if (player.take === f) {
      if (!player.playing) play();
      return;
    }
    if (player.playing) pause();
    player.take = f;
    player.offset = 0;
    roll.selected = null; roll.hover = null;
    if (!player.src) player.src = midiOut() ? "piano" : "computer";
    $("player").classList.remove("empty");
    updatePlayerUI();
    updateFlagButtons();
    showInfo(null);
    refreshListState();
    $("player").scrollIntoView({ block: "nearest", behavior: "smooth" });
    if (autoplay) play();
  }

  function refreshListState() {
    filesEl.querySelectorAll("li").forEach(li => {
      const on = player.take && String(player.take.id) === li.dataset.id;
      li.classList.toggle("playing", !!on);
      const b = li.querySelector("button.listen");
      if (b) {
        const isOn = on && player.playing;
        b.textContent = isOn ? "❚❚ 듣는 중" : "▶ 듣기";
        b.classList.toggle("on", !!isOn);
      }
    });
  }

  function closePlayer() {
    if (player.playing) pause();
    player.take = null;
    $("player").classList.add("empty");
  }

  function updateTime() {
    const take = player.take;
    if (!take) return;
    requestDraw();
    const pos = position();
    if (!player.dragging) seek.value = pos;
    $("pCur").textContent = fmtTime(player.dragging ? Number(seek.value) : pos);
  }

  function updatePlayerUI() {
    const take = player.take;
    if (!take) return;
    $("pTitle").textContent = take.name;
    seek.max = Math.max(1, Math.round(take.duration));
    $("pTot").textContent = fmtTime(take.duration);
    playBtn.innerHTML = player.playing ? ICON_PAUSE : ICON_PLAY;
    playBtn.setAttribute("aria-label", player.playing ? "일시정지" : "재생");
    playBtn.disabled = recording || player.loading;
    const hasOut = !!midiOut();
    document.querySelectorAll(".psrc .src").forEach(b => {
      b.setAttribute("aria-pressed", String(b.dataset.src === player.src));
      if (b.dataset.src === "piano") b.disabled = !hasOut;
    });
    let note = "";
    if (recording) note = "녹음 중에는 들을 수 없어요";
    else if (player.loading) note = "소리 불러오는 중…";
    else if (player.src === "computer") note = "대략 확인용 소리";
    $("pNote").textContent = note;
    updateTime();
  }

  // ---- Piano roll ----
  const NOTE_NAMES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
  const noteName = (n) => NOTE_NAMES[n % 12] + (Math.floor(n / 12) - 1);
  const isBlack = (n) => [1, 3, 6, 8, 10].includes(n % 12);
  const ZOOMS = [3, 5, 10, 20, 40, 80];
  const roll = { zoom: 2, hover: null, selected: null, drawPending: false, showFlags: false, layout: null };
  function syncFlags() {
    roll.showFlags = $("player").classList.contains("adv") && $("flagToggle").checked;
  }
  const canvas = $("roll"), ctx = canvas.getContext("2d");

  function fmtPrecise(ms) {
    const s = ms / 1000;
    return String(Math.floor(s / 60)).padStart(2, "0") + ":" + (s % 60).toFixed(1).padStart(4, "0");
  }

  function velColor(v) {
    // light green-grey (soft) to deep green (loud)
    const a = [199, 211, 227], m = [106, 134, 173], b = [31, 53, 84];
    const x = Math.max(0, Math.min(1, v / 127));
    const [p, q, k] = x < 0.5 ? [a, m, x * 2] : [m, b, (x - 0.5) * 2];
    return `rgb(${p.map((c, i) => Math.round(c + (q[i] - c) * k)).join(",")})`;
  }

  function median(arr) {
    const s = arr.slice().sort((a, b) => a - b), m = s.length >> 1;
    return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
  }

  function buildViz(take) {
    if (take.viz) return take.viz;
    const notes = [], open = {}, pedal = [{ t: 0, v: 0 }];
    for (const ev of take.events) {
      const [st, d1, d2] = ev.bytes, hi = st & 0xF0, ch = st & 0x0F;
      const key = ch + ":" + d1;
      if (hi === 0x90 && d2 > 0) {
        if (open[key]) { open[key].end = ev.t; delete open[key]; }
        const n = { pitch: d1, vel: d2, start: ev.t, end: null, flags: [] };
        notes.push(n); open[key] = n;
      } else if (hi === 0x80 || (hi === 0x90 && d2 === 0)) {
        if (open[key]) { open[key].end = ev.t; delete open[key]; }
      } else if (hi === 0xB0 && d1 === 64) {
        pedal.push({ t: ev.t, v: d2 });
      }
    }
    notes.forEach(n => { if (n.end === null) n.end = take.duration; });
    notes.sort((a, b) => a.start - b.start);

    // heuristics (reference only)
    for (let i = 0; i < notes.length; i++) {
      const n = notes[i], near = [];
      for (let j = i - 1; j >= 0 && n.start - notes[j].start <= 3000; j--)
        if (Math.abs(notes[j].pitch - n.pitch) <= 7) near.push(notes[j].vel);
      for (let j = i + 1; j < notes.length && notes[j].start - n.start <= 3000; j++)
        if (Math.abs(notes[j].pitch - n.pitch) <= 7) near.push(notes[j].vel);
      if (near.length >= 3) {
        const med = median(near);
        if (Math.abs(n.vel - med) >= 28) n.flags.push(n.vel > med ? "주변보다 세기가 튐" : "주변보다 세기가 푹 꺼짐");
      }
      if (n.end - n.start < 40) n.flags.push("아주 짧은 음");
      if (n.vel <= 12) n.flags.push("아주 약한 음");
    }
    let lo = 127, hiP = 0;
    notes.forEach(n => { lo = Math.min(lo, n.pitch); hiP = Math.max(hiP, n.pitch); });
    if (!notes.length) { lo = 48; hiP = 72; }
    lo -= 2; hiP += 2;
    while (hiP - lo < 24) { lo--; hiP++; }
    lo = Math.max(0, lo); hiP = Math.min(127, hiP);
    const flagged = notes.filter(n => n.flags.length);
    take.viz = { notes, pedal, lo, hi: hiP, flagged };
    return take.viz;
  }

  function winMs() { return ZOOMS[roll.zoom] * 1000; }
  function viewStart() {
    return Math.max(0, position() - winMs() * 0.25);
  }

  function requestDraw() {
    if (roll.drawPending || !player.take) return;
    roll.drawPending = true;
    requestAnimationFrame(() => { roll.drawPending = false; drawRoll(); if (player.playing) requestDraw(); });
  }

  function drawRoll() {
    const take = player.take;
    if (!take) return;
    const viz = buildViz(take);
    const dpr = window.devicePixelRatio || 1;
    const W = canvas.clientWidth, H = canvas.clientHeight;
    if (canvas.width !== Math.round(W * dpr) || canvas.height !== Math.round(H * dpr)) {
      canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);

    const G = 46, axisH = 20, gap = 6, velH = 52, pedH = 48;
    const rollTop = 0, rollH = H - axisH - velH - pedH - gap * 2;
    const velTop = rollTop + rollH + gap, pedTop = velTop + velH + gap, axisTop = pedTop + pedH;
    const span = viz.hi - viz.lo + 1, rowH = rollH / span;
    const vs = viewStart(), win = winMs();
    const X = (t) => G + (t - vs) / win * (W - G);
    roll.layout = { G, rollTop, rollH, velTop, velH, pedTop, pedH, rowH, vs, win, W, lo: viz.lo, hi: viz.hi };

    // key rows
    for (let p = viz.lo; p <= viz.hi; p++) {
      const y = rollTop + (viz.hi - p) * rowH;
      ctx.fillStyle = isBlack(p) ? "#EEF1EF" : "#FFFFFF";
      ctx.fillRect(G, y, W - G, rowH);
      ctx.fillStyle = isBlack(p) ? "#2A302D" : "#F7F9F7";
      ctx.fillRect(0, y, G - 18, rowH);
      if (p % 12 === 0) {
        ctx.fillStyle = "#C9D2CC"; ctx.fillRect(G, y + rowH - 1, W - G, 1);
        ctx.fillStyle = "#5B6660"; ctx.font = "11px 'IBM Plex Sans KR', sans-serif";
        ctx.textBaseline = "middle"; ctx.textAlign = "right";
        ctx.fillText(noteName(p), G - 3, y + rowH / 2);
      }
    }
    ctx.fillStyle = "#C9D2CC"; ctx.fillRect(G - 18, rollTop, 1, rollH);

    // time grid
    const step = win <= 5000 ? 500 : win <= 20000 ? 1000 : win <= 40000 ? 5000 : 10000;
    ctx.font = "11px 'IBM Plex Sans KR', sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "top";
    for (let t = Math.ceil(vs / step) * step; t <= vs + win; t += step) {
      const x = X(t);
      ctx.fillStyle = t % (step * 2) === 0 ? "rgba(28,36,33,.10)" : "rgba(28,36,33,.05)";
      ctx.fillRect(x, rollTop, 1, axisTop - rollTop);
      if (t % (step >= 1000 ? step * 2 : 1000) === 0) {
        ctx.fillStyle = "#5B6660"; ctx.fillText(fmtTime(t), x, axisTop + 4);
      }
    }
    // end of recording
    if (take.duration < vs + win) {
      const xe = X(take.duration);
      ctx.fillStyle = "rgba(28,36,33,.06)"; ctx.fillRect(xe, rollTop, W - xe, axisTop - rollTop);
    }

    // lanes background + labels
    ctx.fillStyle = "#F7F9F7";
    ctx.fillRect(G, velTop, W - G, velH); ctx.fillRect(G, pedTop, W - G, pedH);
    ctx.fillStyle = "#1C2421"; ctx.font = "600 12px 'IBM Plex Sans KR', sans-serif";
    ctx.textAlign = "right"; ctx.textBaseline = "middle";
    ctx.fillText("세기", G - 6, velTop + velH / 2);
    ctx.fillText("페달", G - 6, pedTop + pedH / 2);

    const pos = position();
    const showFlags = roll.showFlags;

    // notes + velocity sticks
    for (const n of viz.notes) {
      if (n.end < vs || n.start > vs + win) continue;
      const x1 = X(n.start), x2 = Math.max(X(n.end), x1 + 2);
      const y = rollTop + (viz.hi - n.pitch) * rowH;
      const flagged = showFlags && n.flags.length;
      ctx.fillStyle = velColor(n.vel);
      ctx.fillRect(x1, y + 0.5, x2 - x1, Math.max(2, rowH - 1));
      if (pos >= n.start && pos < n.end) {
        ctx.strokeStyle = "#1C2421"; ctx.lineWidth = 1.5;
        ctx.strokeRect(x1 + .75, y + 1.25, x2 - x1 - 1.5, Math.max(1, rowH - 2.5));
      }
      if (flagged) {
        ctx.strokeStyle = "#D9730D"; ctx.lineWidth = 2.5;
        ctx.strokeRect(x1 - 2, y - 1.5, x2 - x1 + 4, Math.max(2, rowH - 1) + 3);
      }
      if (n === roll.selected || n === roll.hover) {
        ctx.strokeStyle = "#1C2421"; ctx.lineWidth = 2; ctx.setLineDash([3, 2]);
        ctx.strokeRect(x1 - 3.5, y - 3, x2 - x1 + 7, Math.max(2, rowH - 1) + 6);
        ctx.setLineDash([]);
      }
      // velocity stick
      const vh = (n.vel / 127) * (velH - 6);
      ctx.fillStyle = flagged ? "#D9730D" : velColor(n.vel);
      ctx.fillRect(x1, velTop + velH - vh, 3, vh);
      if (n === roll.selected || n === roll.hover) {
        ctx.fillStyle = "#1C2421"; ctx.fillRect(x1 - 1, velTop + velH - vh - 3, 5, 2);
      }
    }

    // pedal curve (step)
    const pv = viz.pedal;
    const PY = (v) => pedTop + pedH - 3 - (v / 127) * (pedH - 6);
    ctx.fillStyle = "rgba(31,53,84,.18)"; ctx.strokeStyle = "#1F3554"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(G, pedTop + pedH);
    let startIdx = 0;
    while (startIdx + 1 < pv.length && pv[startIdx + 1].t <= vs) startIdx++;
    let lastV = pv[startIdx].v, lastX = G;
    ctx.lineTo(G, PY(lastV));
    for (let i = startIdx + 1; i < pv.length && pv[i].t <= vs + win; i++) {
      const x = X(pv[i].t);
      ctx.lineTo(x, PY(lastV)); ctx.lineTo(x, PY(pv[i].v));
      lastV = pv[i].v; lastX = x;
    }
    const xEnd = Math.min(W, X(take.duration));
    ctx.lineTo(xEnd, PY(lastV)); ctx.lineTo(xEnd, pedTop + pedH); ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(G, PY(pv[startIdx].v)); lastV = pv[startIdx].v;
    for (let i = startIdx + 1; i < pv.length && pv[i].t <= vs + win; i++) {
      const x = X(pv[i].t);
      ctx.lineTo(x, PY(lastV)); ctx.lineTo(x, PY(pv[i].v)); lastV = pv[i].v;
    }
    ctx.lineTo(xEnd, PY(lastV)); ctx.stroke();
    // half line
    ctx.setLineDash([4, 4]); ctx.strokeStyle = "rgba(28,36,33,.35)"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(G, PY(64)); ctx.lineTo(W, PY(64)); ctx.stroke(); ctx.setLineDash([]);

    // playhead
    const xp = X(pos);
    ctx.fillStyle = "#1C2421"; ctx.fillRect(xp - 1, rollTop, 2, axisTop - rollTop);
    ctx.beginPath(); ctx.moveTo(xp - 6, rollTop); ctx.lineTo(xp + 6, rollTop); ctx.lineTo(xp, rollTop + 8); ctx.closePath(); ctx.fill();
  }

  function pedalAt(viz, t) {
    let v = 0;
    for (const p of viz.pedal) { if (p.t <= t) v = p.v; else break; }
    return v;
  }

  function hitTest(ev) {
    const L = roll.layout, take = player.take;
    if (!L || !take) return null;
    const r = canvas.getBoundingClientRect();
    const x = ev.clientX - r.left, y = ev.clientY - r.top;
    if (x < L.G) return null;
    const t = L.vs + (x - L.G) / (L.W - L.G) * L.win;
    const viz = buildViz(take);
    if (y >= L.rollTop && y < L.rollTop + L.rollH) {
      const pitch = L.hi - Math.floor((y - L.rollTop) / L.rowH);
      const tol = L.win / (L.W - L.G) * 3;
      const n = viz.notes.find(n => n.pitch === pitch && t >= n.start - tol && t <= n.end + tol);
      return { t, note: n || null, lane: "roll" };
    }
    if (y >= L.velTop && y < L.velTop + L.velH) {
      const tol = L.win / (L.W - L.G) * 5;
      let best = null, bd = Infinity;
      for (const n of viz.notes) {
        const d = Math.abs(n.start - t);
        if (d <= tol && d < bd) { bd = d; best = n; }
      }
      return { t, note: best, lane: "vel" };
    }
    if (y >= L.pedTop && y < L.pedTop + L.pedH) return { t, note: null, lane: "ped", pedal: pedalAt(viz, t) };
    return { t, note: null, lane: "axis" };
  }

  function noteInfo(n) {
    let s = `${noteName(n.pitch)}, 세기 ${n.vel}, 길이 ${((n.end - n.start) / 1000).toFixed(2)}초, ${fmtPrecise(n.start)}`;
    return s;
  }
  function showInfo(hit) {
    const el = $("rollInfo");
    el.textContent = "";
    if (!hit) { el.textContent = roll.selected ? noteInfo(roll.selected) : "음을 클릭하면 그 부분부터 들려요"; appendFlags(el, roll.selected); return; }
    if (hit.note) { el.textContent = noteInfo(hit.note); appendFlags(el, hit.note); }
    else if (hit.lane === "ped") el.textContent = `페달 ${hit.pedal}, ${fmtPrecise(hit.t)}`;
    else el.textContent = fmtPrecise(Math.max(0, hit.t));
  }
  function appendFlags(el, n) {
    if (!n || !n.flags.length || !roll.showFlags) return;
    const b = document.createElement("b");
    b.textContent = "  " + n.flags.join(", ");
    el.appendChild(b);
  }

  canvas.addEventListener("mousemove", (e) => {
    const hit = hitTest(e);
    const n = hit ? hit.note : null;
    if (n !== roll.hover) { roll.hover = n; requestDraw(); }
    showInfo(hit);
  });
  canvas.addEventListener("mouseleave", () => { roll.hover = null; showInfo(null); requestDraw(); });
  canvas.addEventListener("click", (e) => {
    const hit = hitTest(e);
    if (!hit || !player.take) return;
    if (hit.note) {
      roll.selected = hit.note;
      seekTo(Math.max(0, hit.note.start - 400));
    } else {
      roll.selected = null;
      seekTo(Math.max(0, hit.t));
    }
    showInfo(hit);
    requestDraw();
  });

  function setZoom(z) {
    roll.zoom = Math.max(0, Math.min(ZOOMS.length - 1, z));
    $("zoomLabel").textContent = ZOOMS[roll.zoom] + "초 화면";
    requestDraw();
  }
  $("zoomIn").addEventListener("click", () => setZoom(roll.zoom - 1));
  $("zoomOut").addEventListener("click", () => setZoom(roll.zoom + 1));
  $("flagToggle").addEventListener("change", () => { syncFlags(); updateFlagButtons(); requestDraw(); showInfo(null); });
  $("advToggle").addEventListener("click", () => {
    const open = !$("player").classList.contains("adv");
    $("player").classList.toggle("adv", open);
    $("advToggle").setAttribute("aria-expanded", String(open));
    $("advToggle").textContent = open ? "검수 도구 닫기 ▴" : "자세히 검수하기 ▾";
    syncFlags(); updateFlagButtons(); requestDraw(); showInfo(null);
  });

  function jumpFlag(dir) {
    const take = player.take;
    if (!take) return;
    const list = buildViz(take).flagged;
    if (!list.length) return;
    const ref = roll.selected ? roll.selected.start : position() + 400;
    let target = null;
    if (dir > 0) target = list.find(n => n.start > ref + 1) || list[0];
    else target = [...list].reverse().find(n => n.start < ref - 1) || list[list.length - 1];
    roll.selected = target;
    seekTo(Math.max(0, target.start - 400));
    showInfo(null);
    requestDraw();
  }
  $("prevFlag").addEventListener("click", () => jumpFlag(-1));
  $("nextFlag").addEventListener("click", () => jumpFlag(1));
  function updateFlagButtons() {
    const n = player.take ? buildViz(player.take).flagged.length : 0;
    $("prevFlag").disabled = $("nextFlag").disabled = !roll.showFlags || !n;
    $("nextFlag").textContent = n ? `다음 의심 음 (${n}개)` : "의심 음 없음";
    $("prevFlag").style.display = n ? "" : "none";
  }
  window.addEventListener("resize", requestDraw);

  playBtn.addEventListener("click", () => { player.playing ? pause() : play(); });
  seek.addEventListener("input", () => { player.dragging = true; updateTime(); });
  seek.addEventListener("change", () => { player.dragging = false; seekTo(Number(seek.value)); });
  document.querySelectorAll(".psrc .src").forEach(b => b.addEventListener("click", () => {
    if (b.disabled || player.src === b.dataset.src) return;
    const was = player.playing;
    if (was) pause();
    player.src = b.dataset.src;
    updatePlayerUI();
    if (was) play();
  }));
  document.addEventListener("keydown", (e) => {
    if (e.code !== "Space" || !player.take || recording) return;
    if (["INPUT", "BUTTON"].includes(document.activeElement.tagName)) return;
    e.preventDefault();
    player.playing ? pause() : play();
  });

  // ---- ZIP (stored, UTF-8 names) ----
  const CRC_TABLE = (() => {
    const t = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      t[n] = c >>> 0;
    }
    return t;
  })();
  function crc32(buf) {
    let c = 0xFFFFFFFF;
    for (let i = 0; i < buf.length; i++) c = CRC_TABLE[(c ^ buf[i]) & 255] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }
  function buildZip(files) {
    const enc = new TextEncoder();
    const d = new Date();
    const dosTime = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
    const dosDate = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
    const le16 = (n) => [n & 255, (n >> 8) & 255];
    const le32 = (n) => [n & 255, (n >>> 8) & 255, (n >>> 16) & 255, (n >>> 24) & 255];
    const parts = [], central = [];
    let offset = 0;
    for (const f of files) {
      const name = enc.encode(f.name), data = f.data, crc = crc32(data);
      const local = new Uint8Array([
        ...le32(0x04034B50), ...le16(20), ...le16(0x0800), ...le16(0),
        ...le16(dosTime), ...le16(dosDate), ...le32(crc), ...le32(data.length), ...le32(data.length),
        ...le16(name.length), ...le16(0), ...name]);
      parts.push(local, data);
      central.push(new Uint8Array([
        ...le32(0x02014B50), ...le16(20), ...le16(20), ...le16(0x0800), ...le16(0),
        ...le16(dosTime), ...le16(dosDate), ...le32(crc), ...le32(data.length), ...le32(data.length),
        ...le16(name.length), ...le16(0), ...le16(0), ...le16(0), ...le16(0), ...le32(0), ...le32(offset),
        ...name]));
      offset += local.length + data.length;
    }
    const cdSize = central.reduce((a, c) => a + c.length, 0);
    const end = new Uint8Array([
      ...le32(0x06054B50), ...le16(0), ...le16(0), ...le16(files.length), ...le16(files.length),
      ...le32(cdSize), ...le32(offset), ...le16(0)]);
    return new Blob([...parts, ...central, end], { type: "application/zip" });
  }

  $("bulkBtn").addEventListener("click", () => {
    if (!saved.length) return;
    const used = {};
    // oldest first inside the zip, so the order matches the playing order
    const files = saved.slice().reverse().map(f => {
      let n = cleanName(f.name) || ("녹음 " + f.id);
      if (used[n]) { used[n]++; n = n + " (" + used[n] + ")"; } else used[n] = 1;
      return { name: n + ".mid", data: f.bytes };
    });
    const d = new Date(), pad = (x) => String(x).padStart(2, "0");
    const zipName = `피아노녹음_${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}.zip`;
    download(buildZip(files), zipName);
    saved.forEach(f => { f.downloaded = true; });
    renderList();
    toast(files.length + "개를 zip 파일로 받음 (다운로드 폴더)");
  });

  // ---- Standard MIDI File (format 0) writer ----
  function vlq(n) {
    const out = [n & 0x7F];
    n = Math.floor(n / 128);
    while (n > 0) { out.unshift((n & 0x7F) | 0x80); n = Math.floor(n / 128); }
    return out;
  }
  function u32(n) { return [(n >>> 24) & 255, (n >>> 16) & 255, (n >>> 8) & 255, n & 255]; }
  function u16(n) { return [(n >> 8) & 255, n & 255]; }

  function buildSMF(evs, durationMs) {
    const sorted = evs.map((e, i) => ({ ...e, i })).sort((a, b) => a.t - b.t || a.i - b.i);
    const trk = [];
    trk.push(0, 0xFF, 0x03, 5, ...Array.from("Piano", c => c.charCodeAt(0)));
    trk.push(0, 0xFF, 0x51, 0x03, (TEMPO_US >> 16) & 255, (TEMPO_US >> 8) & 255, TEMPO_US & 255);
    trk.push(0, 0xFF, 0x58, 0x04, 4, 2, 24, 8);
    let last = 0;
    for (const ev of sorted) {
      const tick = Math.round(ev.t * TICKS_PER_MS);
      trk.push(...vlq(Math.max(0, tick - last)), ...ev.bytes);
      last = Math.max(last, tick);
    }
    const endTick = Math.max(last, Math.round(durationMs * TICKS_PER_MS));
    trk.push(...vlq(endTick - last), 0xFF, 0x2F, 0x00);

    const header = [0x4D, 0x54, 0x68, 0x64, ...u32(6), ...u16(0), ...u16(1), ...u16(PPQ)];
    const trackHead = [0x4D, 0x54, 0x72, 0x6B, ...u32(trk.length)];
    return new Uint8Array([...header, ...trackHead, ...trk]);
  }

  // ---- wiring ----
  updateNext();
  recBtn.addEventListener("click", () => { recording ? stop() : start(); });
  window.addEventListener("beforeunload", (e) => {
    if (recording || saved.some(f => !f.downloaded)) { e.preventDefault(); e.returnValue = ""; }
  });

  const env = checkEnv();
  if (env.iOS || !env.hasMIDI || !env.secure) return;

  setCheck("midi", "wait", "허용 기다리는 중", {
    title: "MIDI 사용을 허용해 주세요",
    fix: "화면 위쪽에 뜬 작은 창에서 '허용'을 눌러 주세요."
  });
  setCheck("piano", "wait", "확인 중");
  // only show the "please allow" card if the prompt is actually waiting
  const waitTimer = setTimeout(() => {
    if (checks.midi && checks.midi.state === "wait") { checks.midi.state = "warn"; renderChecks(); }
  }, 900);

  function midiDenied() {
    clearTimeout(waitTimer);
    setCheck("midi", "bad", "거부됨", {
      title: "MIDI 사용이 막혀 있어요",
      fix: "주소창 왼쪽의 아이콘을 누르고 'MIDI 기기'를 '허용'으로 바꾼 뒤, 새로고침해 주세요."
    });
    setCheck("piano", "wait", "—");
  }
  navigator.requestMIDIAccess({ sysex: false }).then(access => {
    clearTimeout(waitTimer);
    midi = access;
    setCheck("midi", "ok", "허용됨");
    midi.onstatechange = refreshInputs;
    refreshInputs();
  }).catch(midiDenied);
  try {
    navigator.permissions.query({ name: "midi" }).then(st => {
      st.onchange = () => { if (st.state === "granted" && !midi) location.reload(); };
    }).catch(() => {});
  } catch (e) {}

  window.__buildSMF = buildSMF; window.__buildZip = buildZip; // for testing
})();
</script>
</body>
</html>
